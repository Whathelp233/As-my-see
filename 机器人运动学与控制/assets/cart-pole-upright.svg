  <circle cx="255" cy="213" r="15" fill="white" stroke="#263746" stroke-width="4"/>
  <circle cx="203" cy="155" r="5" fill="#222"/>
  <line x1="203" y1="155" x2="203" y2="58" stroke="#777" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="203" y1="155" x2="238" y2="67" stroke="#163d62" stroke-width="6"/>
  <circle cx="229" cy="90" r="7" fill="#bc4c39"/>
  <path d="M203,116 A39,39 0 0 1 217,119" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
